name: 测试流水线

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 同一分支的新提交自动取消旧运行，省时间也省配额
concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHONIOENCODING: utf-8

jobs:
  # ---------- 第 1 关：语法与静态检查（最快，先拦住低级错误）----------
  lint:
    name: 语法与静态检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: 安装依赖
        run: pip install -r requirements.txt
      - name: 全部文件语法检查
        run: python -m compileall -q . 
      - name: 用体检器扫描本项目
        run: python scanner.py . --no-tests || true   # 只做信息输出，不阻断
      - name: 零依赖语句覆盖率（低于 90% 直接红）
        run: python coverage_simple.py --min 90

  # ---------- 第 2 关：冒烟（主干通了才继续）----------
  smoke:
    name: 冒烟测试
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 只跑冒烟用例
        run: python -m pytest -m smoke -q

  # ---------- 第 3 关：全量回归（三版本矩阵）----------
  regression:
    name: 全量回归 (Python ${{ matrix.python }})
    needs: smoke
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -r requirements.txt
      - name: 跑全部用例（输出 JUnit XML 供后续转报告）
        run: python -m pytest -q --junitxml=report.xml
      - name: 生成 HTML 报告
        if: always()
        run: python reports.py || true
      - name: 失败时保留证据
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-py${{ matrix.python }}
          path: |
            report.xml
            report.html
          if-no-files-found: ignore

  # ---------- 第 4 关：UI 层（Playwright 点真页面）----------
  ui:
    name: UI 层 (Playwright)
    needs: smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: 安装接口依赖
        run: pip install -r requirements.txt
      - name: 安装 UI 依赖与 Chromium
        run: |
          pip install -r requirements-ui.txt
          python -m playwright install --with-deps chromium
      - name: 跑 UI 用例
        run: python -m pytest ui_tests -q
      - name: 失败时留存截图与 trace
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-artifacts
          path: artifacts/
          if-no-files-found: ignore

  # ---------- 第 5 关：汇总（任一关失败则整体红）----------
  gate:
    name: 结果汇总
    needs: [lint, smoke, regression, ui]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: 判断各关状态
        run: |
          echo "lint=${{ needs.lint.result }}"
          echo "smoke=${{ needs.smoke.result }}"
          echo "regression=${{ needs.regression.result }}"
          echo "ui=${{ needs.ui.result }}"
          if [ "${{ needs.lint.result }}" != "success" ] || \
             [ "${{ needs.smoke.result }}" != "success" ] || \
             [ "${{ needs.regression.result }}" != "success" ] || \
             [ "${{ needs.ui.result }}" != "success" ]; then
            echo "::error::流水线未通过"
            exit 1
          fi
          echo "流水线全部通过 ✅"