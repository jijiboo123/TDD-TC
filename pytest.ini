[pytest]
testpaths = tests
python_files = test_*.py
addopts = -v --tb=short
markers =
    smoke: 冒烟用例，每次提交都该跑
    regression: 回归用例，改动后跑
    slow: 较慢的用例，可跳过
    flaky(reruns=2, delay=0.3): 失败后自动重试，只用于已知偶发失败
    ui: 需要浏览器的 UI 用例（先装 playwright 与 chromium），默认不随 pytest 跑
    live: 联网跑真实公开 API（设 LIVE_API=1 才执行），默认不随 pytest 跑